name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-cross-platform:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="$RELEASE_TAG"
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/gmessages.exe .
            (cd dist && zip -q "../gmessages-${GOOS}-${GOARCH}.zip" gmessages.exe)
          else
            go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/gmessages .
            tar -C dist -czf "gmessages-${GOOS}-${GOARCH}.tar.gz" gmessages
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmessages-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gmessages-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            gmessages-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: ignore
          retention-days: 7

  publish-container:
    name: Publish container image
    needs: [build-cross-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push container image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: [build-cross-platform, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTAINER_IMAGE: ${{ needs.publish-container.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gmessages-*
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;

          # Generate SHA256 checksums for verification
          (cd release && shasum -a 256 * > SHA256SUMS)

      - name: Generate release notes
        id: notes
        run: |
          tag="$RELEASE_TAG"
          previous=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -n1)
          if [ -z "$previous" ]; then
            git log --pretty=format:"- %s (%h)" > NOTES.md
          else
            git log "${previous}..${tag}" --pretty=format:"- %s (%h)" > NOTES.md
          fi
          printf '\n\n## Container image\n\n`docker pull %s:%s`\n' "$CONTAINER_IMAGE" "$tag" >> NOTES.md
          echo "Generated notes from ${previous:-beginning} to ${tag}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file NOTES.md
          else
            gh release create "$tag" \
              --title "Google Messages MCP ${tag}" \
              --notes-file NOTES.md \
              release/*
          fi
